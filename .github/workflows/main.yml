name: Global SEO Rolling Cycle
on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  seo-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write # Crucial for saving the DB
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Dependencies
        run: |
          pip uninstall -y google google-generativeai
          pip install -U google-genai yt-dlp

      - name: Run Rolling Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python engine.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "SEO-Cycle-Bot"
          git config --global user.email "bot@seo.com"
          git add video_db.json index.html
          git diff-index --quiet HEAD || (git commit -m "Daily Refresh: $(date)" && git push)

      - name: Deploy to Public Hub (Using Workflow Token)
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
        run: |
          git clone https://x-access-token:${PAT}@github.com/bilalnaziryoutuber/my-seo-hub.git target || exit 0
          cp index.html target/
          cd target
          git add .
          git diff-index --quiet HEAD || (git commit -m "SEO Hub Update: $(date)" && git push origin main) || echo "No changes or push skipped"
